<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book PDF Writer · download & local storage</title>
    <meta name="description" content="Create book-style PDFs in your browser. Type text, download as a beautifully formatted PDF book, and save to local storage.">
    <!-- PDF-lib for creating PDFs -->
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5efe6 0%, #e8e0d3 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-card {
            max-width: 960px;
            width: 100%;
            background: #fffdf9;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(60, 40, 20, 0.35), 0 0 0 1px rgba(120, 90, 60, 0.08);
            padding: 32px 34px 38px;
            transition: all 0.2s;
            border: 1px solid #e8ddce;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #4a2e1e;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.01em;
            font-family: Georgia, 'Times New Roman', serif;
        }
        h1 span {
            background: #f3e9d9;
            border-radius: 50px;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #7a5230;
            letter-spacing: 0.03em;
            margin-left: auto;
            font-family: system-ui, sans-serif;
            border: 1px solid #e2d2bd;
        }
        .subhead {
            color: #7a6045;
            margin-top: -4px;
            margin-bottom: 24px;
            font-size: 0.98rem;
            border-left: 4px solid #b98c5a;
            padding-left: 16px;
            font-family: Georgia, serif;
            font-style: italic;
        }
        .cover-preview {
            background: #f7f0e4;
            border: 1px dashed #cbb492;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            font-size: 0.88rem;
            color: #6b4f33;
        }
        .cover-preview label {
            font-weight: 600;
            color: #4a2e1e;
            font-family: Georgia, serif;
            white-space: nowrap;
        }
        .cover-preview input {
            flex: 1;
            min-width: 160px;
            padding: 8px 14px;
            border: 1px solid #d6c3a8;
            border-radius: 30px;
            font-size: 0.9rem;
            background: white;
            color: #3b2a1a;
            outline: none;
            font-family: Georgia, serif;
        }
        .cover-preview input:focus {
            border-color: #b98c5a;
            box-shadow: 0 0 0 3px rgba(185, 140, 90, 0.15);
        }
        .writer-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        textarea {
            width: 100%;
            min-height: 300px;
            padding: 22px 26px;
            font-size: 1.05rem;
            line-height: 1.7;
            border: 1.5px solid #d9c9b2;
            border-radius: 14px;
            background: #fffdf8;
            resize: vertical;
            outline: none;
            transition: 0.2s;
            color: #2e1f12;
            font-family: Georgia, 'Times New Roman', serif;
            box-shadow: inset 0 2px 8px rgba(100, 70, 40, 0.05);
        }
        textarea:focus {
            border-color: #b98c5a;
            box-shadow: 0 0 0 4px rgba(185, 140, 90, 0.12), inset 0 2px 8px rgba(100, 70, 40, 0.05);
            background: #ffffff;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            background: white;
            border: 1.5px solid #d3c1a8;
            color: #4a2e1e;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 6px -2px rgba(90, 60, 30, 0.08);
            letter-spacing: 0.01em;
            flex: 0 0 auto;
            font-family: system-ui, sans-serif;
        }
        button i {
            font-style: normal;
            font-size: 1.15rem;
            line-height: 1;
        }
        button:hover {
            background: #fdf6ec;
            border-color: #b98c5a;
            transform: translateY(-1px);
            box-shadow: 0 10px 16px -8px rgba(120, 80, 40, 0.3);
        }
        button:active {
            transform: translateY(1px);
            box-shadow: none;
        }
        .btn-primary {
            background: #6b4226;
            border: 1.5px solid #6b4226;
            color: #fff8ee;
        }
        .btn-primary:hover {
            background: #57351d;
            border-color: #57351d;
            color: #ffffff;
        }
        .btn-storage {
            background: #f0e6d6;
            border-color: #d3c1a8;
            color: #5a3d22;
        }
        .btn-storage:hover {
            background: #e8dbc7;
            border-color: #b98c5a;
        }
        .status {
            margin-top: 24px;
            font-size: 0.93rem;
            background: #f7f0e4;
            border-radius: 40px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #5a3d22;
            border: 1px solid #e2d2bd;
            transition: 0.2s;
            min-height: 56px;
            font-family: Georgia, serif;
        }
        .status .icon {
            font-size: 1.3rem;
        }
        .status.success {
            background: #e8f2e4;
            border-color: #b3d1a4;
            color: #3d6b2a;
        }
        .status.warning {
            background: #fbf0dd;
            border-color: #e8c98a;
            color: #8a5d1f;
        }
        .footer-note {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #9c876b;
            margin-top: 18px;
            padding: 0 6px;
            font-family: Georgia, serif;
            font-style: italic;
        }
        @media (max-width: 640px) {
            .app-card { padding: 22px 18px 28px; }
            h1 { font-size: 1.6rem; }
            button { padding: 10px 18px; font-size: 0.88rem; }
        }
    </style>
</head>
<body>
    <div class="app-card">
        <h1>
            📖 Book PDF Writer
            <span>pdf-lib</span>
        </h1>
        <div class="subhead">
            Turn your text into a beautifully formatted book-style PDF with cover, page numbers & headers
        </div>

        <div class="cover-preview">
            <label>📕 Book Title:</label>
            <input type="text" id="bookTitle" placeholder="Untitled Book" value="My Book">
            <label>✍️ Author:</label>
            <input type="text" id="bookAuthor" placeholder="Anonymous" value="Anonymous">
        </div>

        <div class="writer-area">
            <textarea id="contentInput" placeholder="Write your book content here… Each line break starts a new paragraph.">Chapter One

It was a bright cold day in April, and the clocks were striking thirteen. The wind whistled through the ancient oaks, carrying whispers of stories long forgotten.

The old library stood at the edge of town, its stone walls covered in ivy that had grown unchecked for decades. Inside, thousands of books lined the shelves, each one holding a world of its own.

Chapter Two

Maya pushed open the heavy oak door, and the smell of old paper and leather filled her senses. She had been searching for this place her entire life — a library that only appeared to those who truly needed it.

On the central table lay a single book, bound in deep blue leather with gold lettering. It had no title, but she knew instinctively that it was meant for her.</textarea>

            <div class="toolbar">
                <div class="btn-group">
                    <button id="downloadPdfBtn" class="btn-primary" title="Download as book-style PDF">
                        <i>📖</i> Download as Book PDF
                    </button>
                    <button id="saveToStorageBtn" class="btn-storage" title="Save current text to browser local storage">
                        <i>💾</i> Save
                    </button>
                    <button id="loadFromStorageBtn" title="Load text from local storage">
                        <i>📂</i> Load
                    </button>
                    <button id="clearStorageBtn" title="Remove saved text from local storage">
                        <i>🗑️</i> Clear
                    </button>
                </div>
            </div>

            <div id="statusMessage" class="status">
                <span class="icon">📌</span>
                <span id="statusText">Ready. Write your book and click "Download as Book PDF".</span>
            </div>
        </div>
        <div class="footer-note">
            <span>📖 Book‑style PDF: cover page, headers, page numbers</span>
            <span>💾 LocalStorage key: <code>book_pdf_content</code></span>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM refs ----------
            const contentInput = document.getElementById('contentInput');
            const bookTitleInput = document.getElementById('bookTitle');
            const bookAuthorInput = document.getElementById('bookAuthor');
            const downloadBtn = document.getElementById('downloadPdfBtn');
            const saveBtn = document.getElementById('saveToStorageBtn');
            const loadBtn = document.getElementById('loadFromStorageBtn');
            const clearBtn = document.getElementById('clearStorageBtn');
            const statusDiv = document.getElementById('statusMessage');
            const statusText = document.getElementById('statusText');
            const iconSpan = statusDiv.querySelector('.icon');

            // ---------- Constants ----------
            const STORAGE_KEY = 'book_pdf_content';
            const STORAGE_TITLE_KEY = 'book_pdf_title';
            const STORAGE_AUTHOR_KEY = 'book_pdf_author';
            const DEFAULT_TEXT = `Chapter One

It was a bright cold day in April, and the clocks were striking thirteen. The wind whistled through the ancient oaks, carrying whispers of stories long forgotten.

The old library stood at the edge of town, its stone walls covered in ivy that had grown unchecked for decades. Inside, thousands of books lined the shelves, each one holding a world of its own.

Chapter Two

Maya pushed open the heavy oak door, and the smell of old paper and leather filled her senses. She had been searching for this place her entire life — a library that only appeared to those who truly needed it.

On the central table lay a single book, bound in deep blue leather with gold lettering. It had no title, but she knew instinctively that it was meant for her.`;

            // ---------- Helper: update status ----------
            function setStatus(message, type = 'info') {
                statusText.textContent = message;
                statusDiv.classList.remove('success', 'warning');
                if (type === 'success') {
                    statusDiv.classList.add('success');
                    iconSpan.textContent = '✅';
                } else if (type === 'warning') {
                    statusDiv.classList.add('warning');
                    iconSpan.textContent = '⚠️';
                } else {
                    iconSpan.textContent = '📌';
                }
            }

            // ---------- Helper: wrap text to fit width ----------
            function wrapText(text, font, fontSize, maxWidth) {
                const wrappedLines = [];
                const rawLines = text.split(/\r?\n/);

                for (let line of rawLines) {
                    if (line.trim() === '') {
                        wrappedLines.push('');
                        continue;
                    }

                    const words = line.split(/(\s+)/);
                    let currentLine = '';

                    for (let token of words) {
                        if (token === '') continue;
                        const testLine = currentLine + token;
                        const testWidth = font.widthOfTextAtSize(testLine, fontSize);

                        if (testWidth <= maxWidth) {
                            currentLine = testLine;
                        } else {
                            if (currentLine.trim() !== '') {
                                wrappedLines.push(currentLine.trimEnd());
                                currentLine = token;
                            } else {
                                // Handle very long single word
                                if (font.widthOfTextAtSize(token, fontSize) > maxWidth) {
                                    let remaining = token;
                                    while (remaining.length > 0) {
                                        let chunk = '';
                                        for (let i = 1; i <= remaining.length; i++) {
                                            const sub = remaining.substring(0, i);
                                            if (font.widthOfTextAtSize(sub, fontSize) <= maxWidth) {
                                                chunk = sub;
                                            } else {
                                                break;
                                            }
                                        }
                                        if (chunk === '') chunk = remaining.charAt(0);
                                        wrappedLines.push(chunk);
                                        remaining = remaining.substring(chunk.length);
                                    }
                                    currentLine = '';
                                } else {
                                    wrappedLines.push(token);
                                    currentLine = '';
                                }
                            }
                        }
                    }
                    if (currentLine.trim() !== '') {
                        wrappedLines.push(currentLine.trimEnd());
                    }
                }

                if (wrappedLines.length === 0) wrappedLines.push(' ');
                return wrappedLines;
            }

            // ---------- 1. Download as Book-style PDF ----------
            async function downloadBookPdf() {
                const text = contentInput.value.trim();
                if (!text) {
                    setStatus('Cannot create book: content is empty.', 'warning');
                    return;
                }

                const title = (bookTitleInput.value.trim() || 'Untitled Book');
                const author = (bookAuthorInput.value.trim() || 'Anonymous');

                try {
                    setStatus('Binding your book…', 'info');
                    const { PDFDocument, StandardFonts, rgb } = window.PDFLib;

                    const pdfDoc = await PDFDocument.create();

                    // ---- Fonts (serif for book feel) ----
                    const serifFont = await pdfDoc.embedFont(StandardFonts.TimesRoman);
                    const serifBold = await pdfDoc.embedFont(StandardFonts.TimesRomanBold);
                    const serifItalic = await pdfDoc.embedFont(StandardFonts.TimesRomanItalic);

                    // ---- Book page dimensions (A5-ish, nice for books) ----
                    // Using A5: 419.53 x 595.28 points
                    const pageWidth = 419.53;
                    const pageHeight = 595.28;

                    // ---- Colors ----
                    const darkBrown = rgb(0.28, 0.18, 0.10);
                    const midBrown = rgb(0.45, 0.32, 0.20);
                    const lightCream = rgb(0.98, 0.96, 0.92);

                    // ============================================
                    //  COVER PAGE
                    // ============================================
                    const coverPage = pdfDoc.addPage([pageWidth, pageHeight]);

                    // Full background cream color
                    coverPage.drawRectangle({
                        x: 0, y: 0,
                        width: pageWidth,
                        height: pageHeight,
                        color: lightCream,
                    });

                    // Decorative border
                    coverPage.drawRectangle({
                        x: 20, y: 20,
                        width: pageWidth - 40,
                        height: pageHeight - 40,
                        borderColor: midBrown,
                        borderWidth: 2,
                        borderOpacity: 0.6,
                    });

                    coverPage.drawRectangle({
                        x: 26, y: 26,
                        width: pageWidth - 52,
                        height: pageHeight - 52,
                        borderColor: midBrown,
                        borderWidth: 0.8,
                        borderOpacity: 0.4,
                    });

                    // Title (centered, bold serif)
                    const titleFontSize = 28;
                    const titleWidth = serifBold.widthOfTextAtSize(title, titleFontSize);
                    const titleY = pageHeight * 0.62;

                    coverPage.drawText(title, {
                        x: (pageWidth - titleWidth) / 2,
                        y: titleY,
                        size: titleFontSize,
                        font: serifBold,
                        color: darkBrown,
                    });

                    // Decorative line under title
                    coverPage.drawLine({
                        start: { x: pageWidth * 0.25, y: titleY - 18 },
                        end: { x: pageWidth * 0.75, y: titleY - 18 },
                        thickness: 1.2,
                        color: midBrown,
                        opacity: 0.6,
                    });

                    // Subtitle / "A Book By"
                    const subtitleText = 'A Book By';
                    const subtitleSize = 11;
                    const subtitleWidth = serifItalic.widthOfTextAtSize(subtitleText, subtitleSize);
                    coverPage.drawText(subtitleText, {
                        x: (pageWidth - subtitleWidth) / 2,
                        y: pageHeight * 0.48,
                        size: subtitleSize,
                        font: serifItalic,
                        color: midBrown,
                    });

                    // Author name
                    const authorFontSize = 18;
                    const authorWidth = serifFont.widthOfTextAtSize(author, authorFontSize);
                    coverPage.drawText(author, {
                        x: (pageWidth - authorWidth) / 2,
                        y: pageHeight * 0.43,
                        size: authorFontSize,
                        font: serifFont,
                        color: darkBrown,
                    });

                    // Small decorative ornament
                    const ornament = '❦';
                    const ornamentSize = 20;
                    const ornamentWidth = serifFont.widthOfTextAtSize(ornament, ornamentSize);
                    coverPage.drawText(ornament, {
                        x: (pageWidth - ornamentWidth) / 2,
                        y: pageHeight * 0.30,
                        size: ornamentSize,
                        font: serifFont,
                        color: midBrown,
                    });

                    // Year at bottom
                    const year = new Date().getFullYear().toString();
                    const yearSize = 10;
                    const yearWidth = serifFont.widthOfTextAtSize(year, yearSize);
                    coverPage.drawText(year, {
                        x: (pageWidth - yearWidth) / 2,
                        y: 55,
                        size: yearSize,
                        font: serifFont,
                        color: midBrown,
                    });

                    // ============================================
                    //  CONTENT PAGES
                    // ============================================
                    const marginTop = 70;
                    const marginBottom = 70;
                    const marginLeft = 55;
                    const marginRight = 55;
                    const contentFontSize = 10.5;
                    const lineHeight = contentFontSize * 1.6;
                    const contentMaxWidth = pageWidth - marginLeft - marginRight;

                    // Wrap the text
                    const wrappedLines = wrapText(text, serifFont, contentFontSize, contentMaxWidth);

                    // Running header text (truncated title)
                    const headerText = title.length > 40 ? title.substring(0, 38) + '…' : title;

                    let pageNum = 1; // content page counter (starts at 1 after cover)
                    let currentPage = null;
                    let y = 0;

                    // Helper to start a new content page
                    function startNewPage() {
                        currentPage = pdfDoc.addPage([pageWidth, pageHeight]);

                        // Cream background
                        currentPage.drawRectangle({
                            x: 0, y: 0,
                            width: pageWidth,
                            height: pageHeight,
                            color: rgb(0.995, 0.985, 0.965),
                        });

                        // Running header (book title, italic, small, centered top)
                        const headerSize = 8;
                        const headerWidth = serifItalic.widthOfTextAtSize(headerText, headerSize);
                        currentPage.drawText(headerText, {
                            x: (pageWidth - headerWidth) / 2,
                            y: pageHeight - 38,
                            size: headerSize,
                            font: serifItalic,
                            color: midBrown,
                            opacity: 0.7,
                        });

                        // Thin header rule
                        currentPage.drawLine({
                            start: { x: marginLeft, y: pageHeight - 48 },
                            end: { x: pageWidth - marginRight, y: pageHeight - 48 },
                            thickness: 0.5,
                            color: midBrown,
                            opacity: 0.3,
                        });

                        // Page number at bottom center
                        const pageNumStr = pageNum.toString();
                        const pageNumSize = 9;
                        const pageNumWidth = serifFont.widthOfTextAtSize(pageNumStr, pageNumSize);
                        currentPage.drawText(pageNumStr, {
                            x: (pageWidth - pageNumWidth) / 2,
                            y: 40,
                            size: pageNumSize,
                            font: serifFont,
                            color: midBrown,
                            opacity: 0.75,
                        });

                        // Small ornaments beside page number
                        const ornSize = 7;
                        currentPage.drawText('❧', {
                            x: (pageWidth / 2) - 25,
                            y: 40,
                            size: ornSize,
                            font: serifFont,
                            color: midBrown,
                            opacity: 0.5,
                        });
                        currentPage.drawText('☙', {
                            x: (pageWidth / 2) + 15,
                            y: 40,
                            size: ornSize,
                            font: serifFont,
                            color: midBrown,
                            opacity: 0.5,
                        });

                        y = pageHeight - marginTop;
                    }

                    // Start the first content page
                    startNewPage();

                    // Draw each wrapped line
                    for (let i = 0; i < wrappedLines.length; i++) {
                        const lineText = wrappedLines[i];

                        // New page if needed
                        if (y - lineHeight < marginBottom) {
                            pageNum++;
                            startNewPage();
                        }

                        if (lineText.trim() !== '') {
                            // Detect chapter headings: short line, not ending with punctuation, all caps or title-ish
                            const isLikelyHeading =
                                lineText.length < 50 &&
                                !/[.,;:!?]$/.test(lineText.trim()) &&
                                /^[A-Z0-9]/.test(lineText.trim()) &&
                                wrappedLines[i + 1] !== undefined &&
                                wrappedLines[i + 1].trim() === '';

                            if (isLikelyHeading) {
                                // Draw heading centered, bold, with extra spacing
                                const headSize = 12.5;
                                const headWidth = serifBold.widthOfTextAtSize(lineText, headSize);
                                // If too wide, use regular draw
                                if (headWidth <= contentMaxWidth) {
                                    currentPage.drawText(lineText, {
                                        x: (pageWidth - headWidth) / 2,
                                        y: y - headSize,
                                        size: headSize,
                                        font: serifBold,
                                        color: darkBrown,
                                    });
                                    y -= lineHeight * 1.4;
                                    continue;
                                }
                            }

                            // Regular paragraph line with first-line indent simulation
                            currentPage.drawText(lineText, {
                                x: marginLeft,
                                y: y - contentFontSize,
                                size: contentFontSize,
                                font: serifFont,
                                color: rgb(0.15, 0.10, 0.07),
                                lineHeight: lineHeight,
                            });
                        }

                        y -= lineHeight;
                    }

                    // ============================================
                    //  BACK PAGE (The End)
                    // ============================================
                    const backPage = pdfDoc.addPage([pageWidth, pageHeight]);
                    backPage.drawRectangle({
                        x: 0, y: 0,
                        width: pageWidth,
                        height: pageHeight,
                        color: lightCream,
                    });

                    const endText = 'The End';
                    const endSize = 22;
                    const endWidth = serifBold.widthOfTextAtSize(endText, endSize);
                    backPage.drawText(endText, {
                        x: (pageWidth - endWidth) / 2,
                        y: pageHeight * 0.55,
                        size: endSize,
                        font: serifBold,
                        color: darkBrown,
                    });

                    const ornSize2 = 16;
                    const ornWidth = serifFont.widthOfTextAtSize('❦', ornSize2);
                    backPage.drawText('❦', {
                        x: (pageWidth - ornWidth) / 2,
                        y: pageHeight * 0.47,
                        size: ornSize2,
                        font: serifFont,
                        color: midBrown,
                    });

                    // ============================================
                    //  SAVE & DOWNLOAD
                    // ============================================
                    const pdfBytes = await pdfDoc.save();
                    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    const safeTitle = title.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                    a.download = `${safeTitle || 'book'}.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1500);

                    setStatus(`Book "${title}" downloaded! ${pageNum} content page${pageNum > 1 ? 's' : ''} + cover.`, 'success');
                } catch (error) {
                    console.error('Book PDF generation error:', error);
                    setStatus('Error creating book PDF: ' + (error.message || 'unknown'), 'warning');
                }
            }

            // ---------- 2. Save to LocalStorage ----------
            function saveToLocalStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, contentInput.value);
                    localStorage.setItem(STORAGE_TITLE_KEY, bookTitleInput.value);
                    localStorage.setItem(STORAGE_AUTHOR_KEY, bookAuthorInput.value);
                    setStatus('Book content, title & author saved.', 'success');
                } catch (e) {
                    setStatus('Failed to save: ' + e.message, 'warning');
                }
            }

            // ---------- 3. Load from LocalStorage ----------
            function loadFromLocalStorage() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    const savedTitle = localStorage.getItem(STORAGE_TITLE_KEY);
                    const savedAuthor = localStorage.getItem(STORAGE_AUTHOR_KEY);

                    if (saved !== null) {
                        contentInput.value = saved;
                        if (savedTitle !== null) bookTitleInput.value = savedTitle;
                        if (savedAuthor !== null) bookAuthorInput.value = savedAuthor;
                        setStatus('Book loaded from localStorage.', 'success');
                    } else {
                        setStatus('No saved book found in localStorage.', 'warning');
                    }
                } catch (e) {
                    setStatus('Error reading localStorage: ' + e.message, 'warning');
                }
            }

            // ---------- 4. Clear saved local storage ----------
            function clearSavedStorage() {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                    localStorage.removeItem(STORAGE_TITLE_KEY);
                    localStorage.removeItem(STORAGE_AUTHOR_KEY);
                    setStatus('Saved book removed from localStorage.', 'success');
                } catch (e) {
                    setStatus('Error clearing storage: ' + e.message, 'warning');
                }
            }

            // ---------- 5. Initialize from storage ----------
            function initializeFromStorage() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved !== null) {
                        contentInput.value = saved;
                        const savedTitle = localStorage.getItem(STORAGE_TITLE_KEY);
                        const savedAuthor = localStorage.getItem(STORAGE_AUTHOR_KEY);
                        if (savedTitle !== null) bookTitleInput.value = savedTitle;
                        if (savedAuthor !== null) bookAuthorInput.value = savedAuthor;
                        setStatus('Loaded previous book from localStorage.', 'info');
                    } else {
                        setStatus('Ready. Write your book and click "Download as Book PDF".', 'info');
                    }
                } catch (e) {
                    setStatus('LocalStorage unavailable, using default text.', 'warning');
                    if (!contentInput.value) contentInput.value = DEFAULT_TEXT;
                }
            }

            // ---------- Attach event listeners ----------
            downloadBtn.addEventListener('click', downloadBookPdf);
            saveBtn.addEventListener('click', saveToLocalStorage);
            loadBtn.addEventListener('click', loadFromLocalStorage);
            clearBtn.addEventListener('click', clearSavedStorage);

            // Initialize
            initializeFromStorage();

            // Ctrl+Enter to download
            contentInput.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                    e.preventDefault();
                    downloadBookPdf();
                }
            });
        })();
    </script>
</body>
    </html>
